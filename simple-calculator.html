<!DOCTYPE html>
<html>
<head>
<title>Simple Calculator</title>
<link rel="stylesheet" href="../style.css">
</head>

<body class="tool-page">

<a href="../Index.html" style="position: absolute; top: 10px; left: 10px; color: #667eea; text-decoration: none; font-weight: bold;">← Back to Home</a>

<h2>Simple Calculator</h2>

<p>Perform basic arithmetic operations: addition, subtraction, multiplication, and division.</p>

<input id="num1" placeholder="First number"><br><br>
<input id="num2" placeholder="Second number"><br><br>
<select id="operation">
<option value="+">Add</option>
<option value="-">Subtract</option>
<option value="*">Multiply</option>
<option value="/">Divide</option>
</select><br><br>

<button onclick="calculate()">Calculate</button>

<h3 id="result"></h3>

<script src="../js/calculator.js"></script>

</body>
</html>
