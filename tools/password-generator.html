<!DOCTYPE html>
<html>
<head>
<title>Password Generator</title>
<link rel="stylesheet" href="../style.css">
</head>

<body class="tool-page">

<a href="../index.html" style="position: absolute; top: 10px; left: 10px; color: #667eea; text-decoration: none; font-weight: bold;">← Back to Home</a>

<h2>🔐 Password Generator</h2>

<p>Create strong, secure passwords with customizable options. Protect your accounts!</p>

<div style="background: rgba(255,255,255,0.9); padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <label>Password Length:</label>
    <input id="length" type="number" value="12" min="4" max="32" style="width: 60px;"><br><br>

    <label><input type="checkbox" id="uppercase" checked> Include Uppercase</label><br>
    <label><input type="checkbox" id="lowercase" checked> Include Lowercase</label><br>
    <label><input type="checkbox" id="numbers" checked> Include Numbers</label><br>
    <label><input type="checkbox" id="symbols" checked> Include Symbols</label><br><br>

    <button onclick="generatePassword()" style="font-size: 1.2em; padding: 10px 20px;">Generate Password</button><br><br>

    <input id="password" readonly style="width: 100%; padding: 10px; font-size: 1.1em; border: 2px solid #667eea; border-radius: 5px;"><br><br>
    <button onclick="copyPassword()">Copy to Clipboard</button>
</div>

<script src="../js/password.js"></script>

</body>
</html>
