<!DOCTYPE html>
<html>
<head>
<title>Text to Speech</title>
<link rel="stylesheet" href="../style.css">
</head>

<body class="tool-page">

<a href="../Index.html" style="position: absolute; top: 10px; left: 10px; color: #667eea; text-decoration: none; font-weight: bold;">← Back to Home</a>

<h2>🗣️ Text to Speech</h2>

<p>Listen to your text! Convert written content to speech with adjustable voice and speed.</p>

<div style="background: rgba(255,255,255,0.9); padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <textarea id="text" placeholder="Enter text to speak..." rows="6" style="width: 100%; padding: 10px; border: 2px solid #667eea; border-radius: 5px;"></textarea><br><br>

    <label>Voice:</label>
    <select id="voiceSelect" style="padding: 5px;"></select><br><br>

    <label>Speed:</label>
    <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1" style="width: 100%;"><br><br>

    <button onclick="speak()" style="font-size: 1.2em; padding: 10px 20px;">🔊 Speak</button>
    <button onclick="stopSpeech()" style="font-size: 1.2em; padding: 10px 20px;">⏹️ Stop</button>
</div>

<script src="../js/texttospeech.js"></script>

</body>
</html>
